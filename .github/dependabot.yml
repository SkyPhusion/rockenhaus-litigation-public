# Dependabot version updates for rockenhaus-litigation-public.
# TypeScript majors are pinned to what @astrojs/check peers allow (closed PR #32).

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

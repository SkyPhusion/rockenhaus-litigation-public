name: Deploy Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Generate document index and PDF text
        run: python3 scripts/generate_site.py

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --destination _site


      # --- Astro half ---
      #
      # Astro builds ONLY /evidence/ and /answers/ as static HTML, then dist/ is
      # merged into _site/ and ONE `pages deploy` ships both halves. No second
      # Pages project, no Worker in front, no routing or DNS change.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify citations against the corpus
        run: node scripts/verify-citations.mjs

      - name: Build Astro (evidence + answers)
        run: npm run build

      - name: Generators stay in their lanes
        run: node scripts/check-collisions.mjs _site dist

      - name: Merge Astro output into the site
        run: cp -r dist/. _site/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=rockenhaus-litigation --branch=main

      - name: Ping IndexNow
        run: python3 scripts/indexnow_ping.py

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: python3 scripts/cloudflare_purge_cache.py

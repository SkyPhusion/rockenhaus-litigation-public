name: Deploy Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Generate document index and PDF text
        run: python3 scripts/generate_site.py

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --destination _site


      # --- Astro half ---
      #
      # Astro builds ONLY /evidence/ and /answers/ as static HTML, then dist/ is
      # merged into _site/ and ONE `pages deploy` ships both halves. No second
      # Pages project, no Worker in front, no routing or DNS change.

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify citations against the corpus
        run: node scripts/verify-citations.mjs

      - name: Build the citation table
        run: node scripts/build-citations.mjs

      - name: Publish corpus page manifest for the AI Search widget
        # The ask-widget resolves R2 object keys to title/URL/page via this file.
        # Shape matches _corpus/manifest.json ({ pages: [...] }).
        run: cp _corpus/manifest.json public/corpus-manifest.json

      - name: Build Astro (evidence + answers)
        run: npm run build

      - name: Generators stay in their lanes
        run: node scripts/check-collisions.mjs _site dist

      - name: Merge Astro output into the site
        run: cp -r dist/. _site/

      - name: Ensure corpus-manifest is on the deploy root
        # Jekyll does not publish public/; Astro copies public/ into dist. After
        # merge, also keep a root copy if the file only landed under dist.
        run: |
          set -euo pipefail
          if [ -f public/corpus-manifest.json ]; then
            cp public/corpus-manifest.json _site/corpus-manifest.json
          elif [ -f _corpus/manifest.json ]; then
            cp _corpus/manifest.json _site/corpus-manifest.json
          else
            echo "::error::no corpus manifest to publish for the ask widget"
            exit 1
          fi

      - name: Build the sitemap from the merged site
        # AFTER the merge and BEFORE the deploy, deliberately. jekyll-sitemap
        # ran inside the Jekyll build, before dist/ was merged in, so it could
        # not see /answers/ and never listed it. Running here means the sitemap
        # describes the tree that is actually being uploaded.
        run: node scripts/build-sitemap.mjs _site --baseline _data/sitemap_baseline.txt

      - name: Derive the IndexNow submission list from that sitemap
        # Submitting a URL is a claim that the URL exists. The only honest
        # source for that claim is the sitemap being deployed in this same run.
        run: node scripts/build-indexnow.mjs _site

      - name: Protected personal information
        # Fails the deploy rather than the build. This is the last point at
        # which anything can be stopped: after the next step the content is
        # public, CC0, and mirrorable, and there is no unpublish.
        run: python3 scripts/check_pii.py _corpus _data _site --check-allowlist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=rockenhaus-litigation --branch=main

      - name: Ping IndexNow
        run: python3 scripts/indexnow_ping.py

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: python3 scripts/cloudflare_purge_cache.py

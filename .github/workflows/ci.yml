name: ci

# Satisfies the `ci` required status check on the aviation-grade org ruleset.
#
# Before this existed the repo had exactly one workflow (cloudflare-pages.yml),
# so `ci` and `coverage` had never reported and EVERY pull request was
# permanently blocked on "Expected -- waiting for status to be reported".
# Admin bypass was the only way to merge, which is the escape hatch becoming the
# routine path on the repo that publishes a court record.
#
# ALWAYS-RUN, no `on.paths` filter and no job-level `if:`. A required check that
# is skipped at the job level never reports at all, which recreates the exact
# deadlock this file exists to fix. Scope is decided INSIDE the job, so an
# out-of-scope run still reports `ci` as green.
#
# What it actually checks is worth stating: a broken Jekyll build means
# rockenhaus.net silently stops publishing filed documents. That failure is
# invisible from the repo and would be noticed only when someone went looking
# for a filing. This is the check that catches it.

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: PDF tools
        # generate_site.py shells out to pdftotext. Without it the generator
        # silently produces documents with no extracted text rather than
        # failing, so the build would pass while publishing empty pages.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generator compiles
        run: python3 -m compileall -q scripts/

      - name: Site builds
        # The real gate. Catches broken Liquid, malformed front matter, a
        # dangling include, and a link to a page that no longer exists.
        run: bundle exec jekyll build --trace

      - name: Build produced pages
        # A build can exit 0 and emit almost nothing if a collection stops
        # resolving. Assert the output is the shape we expect rather than
        # trusting the exit code.
        run: |
          set -euo pipefail
          count=$(find _site -name '*.html' | wc -l)
          echo "built $count html pages"
          if [ "$count" -lt 10 ]; then
            echo "::error::only $count pages built; the site collapsed"
            exit 1
          fi


      # --- Astro half: the evidence system and the pre-rendered Q&A pages ---
      #
      # Added to the EXISTING ci job rather than a new workflow on purpose. The
      # org ruleset requires a check literally named `ci`; a second workflow
      # would not satisfy it, and a second job in this file would not either.

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Corpus is current
        # The committed corpus must match the PDFs it was built from. A filing
        # added without rebuilding would otherwise be invisible to the answer
        # surface while looking perfectly fine in the repository.
        run: node scripts/build-corpus.mjs --check

      - name: Record parity
        # The document slugs are derived in JS now, and /documents/<slug>/ URLs
        # are cited in filed court documents. This proves the derivation still
        # reproduces the 173 published slugs exactly, checked against artifacts
        # the retired Python produced rather than against itself.
        run: node scripts/check-record-parity.mjs

      - name: Citations match the record
        # Every Q&A answer is a quotation from a filed document. This proves each
        # quoted passage actually appears on the page it is cited to, so a
        # mistyped or drifted citation fails here rather than shipping as a
        # citation to a court document.
        run: node scripts/verify-citations.mjs

      - name: Typecheck Astro
        run: npx astro check

      - name: Build Astro
        # The denylist guard runs inside this build: a third-party
        # characterisation reaching a title, description or JSON-LD field throws
        # and the build fails.
        run: npm run build

      - name: Unit tests
        # AFTER the build, deliberately. tests/redirects.test.ts asserts on the
        # BUILT artifact: that dist/404.html exists and that every redirect rule
        # points at a file the build actually emits. Running before the build
        # gave the test nothing to look at, which is how it first failed here.
        # Checking the artifact rather than the source is the point, so the
        # ordering follows from that rather than the other way round.
        run: npx vitest run

      - name: Generators stay in their lanes
        # Two generators, one domain, one Pages project. Fails if both emit the
        # same path, or if Astro emits outside /evidence/ and /answers/.
        run: node scripts/check-collisions.mjs _site dist

      - name: Merge Astro output into the Jekyll site
        # This is what the deploy does, so the accusation check below sees the
        # MERGED site rather than only the Jekyll half.
        run: cp -r dist/. _site/

      - name: No accusations in indexable metadata
        # The defect that put this site in the hole was third-party
        # characterisations reaching titles, descriptions and JSON-LD, where
        # search engines read them as structured claims. Fail the build rather
        # than rediscover it.
        #
        # Scoped to the <head> of EVERY built page plus every JSON-LD block
        # anywhere in the document. That deliberately includes /evidence/:
        # those pages are noindex, but if accusation text ever reached one of
        # their own titles or descriptions this should still catch it. What the
        # scoping excludes is page BODIES, where quotation of filings and of
        # what an artifact shows on its face is legitimate and expected.
        #
        # Implemented as a script rather than inline sed. The previous
        # `sed -n '/<head>/,/<\/head>/p'` is a LINE based range, and Astro emits
        # minified single-line HTML, so the range never terminated and the
        # "head" check silently scanned the entire document body. Measured on a
        # real built page: the slice returned 3540 bytes of a 3540 byte file.
        # Parsing the markup fixes that, and extending to JSON-LD anywhere makes
        # it strictly stronger than the inline version it replaces.
        #
        # This replaced an inline `sed -n '/<head>/,/<\/head>/p'` slice. That
        # slice is LINE based, and Astro emits minified single-line HTML, so the
        # range never terminated and the "head" check silently scanned the whole
        # document. Measured on a real page: the slice returned 3540 of 3540
        # bytes. The replacement parses the markup instead, and additionally
        # covers JSON-LD anywhere in the document, so it is strictly stronger.
        run: python3 scripts/check_indexable_metadata.py _site

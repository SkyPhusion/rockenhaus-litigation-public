name: notify-corpus-sync

# After main deploys new filed PDFs / corpus text, ask search-mcp to re-sync R2
# and reindex rockenhaus-public. Never gates the site deploy (separate workflow
# from pages). A failed dispatch is LOUD -- the run goes red, matching the house
# no-silent-failure standard. The receiver's daily schedule covers any dropped
# or failed notify.
#
# Auth is the org secret SEARCH_DISPATCH_TOKEN (visibility: all repos). Fail-closed
# if the token is unset so a deleted secret cannot look green.

on:
  push:
    branches: ["main"]
    paths:
      - "_corpus/**"
      - "wayne_*/**"
      - "washtenaw_*/**"
      - "scripts/build-corpus.mjs"
      - "scripts/generate_site.py"

permissions:
  contents: read

jobs:
  notify-corpus-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger search-mcp corpus-sync
        env:
          SEARCH_DISPATCH_TOKEN: ${{ secrets.SEARCH_DISPATCH_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${SEARCH_DISPATCH_TOKEN:+SET}" ]; then
            echo "::error::SEARCH_DISPATCH_TOKEN is unset -- cannot notify search-mcp (org secret, visibility all)."
            exit 1
          fi
          payload="$(jq -nc --arg repo "$SOURCE_REPO" --arg sha "$SOURCE_SHA" \
            '{event_type:"corpus-sync",client_payload:{source:$repo,sha:$sha,target:"rockenhaus"}}')"
          code="$(curl -sS -o /tmp/dispatch_resp.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${SEARCH_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/skyphusion-labs/search-mcp/dispatches \
            -d "$payload")"
          echo "repository_dispatch (corpus-sync) -> HTTP ${code}"
          if [ "$code" != "204" ]; then
            echo "::error::corpus-sync dispatch failed (HTTP ${code})."
            cat /tmp/dispatch_resp.txt || true
            exit 1
          fi
          echo "corpus-sync dispatch accepted (search-mcp will reindex rockenhaus)."

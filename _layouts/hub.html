---
layout: default
---
{% if page.breadcrumbs %}
{% include breadcrumbs.html items=page.breadcrumbs %}
{% endif %}
<article class="hub-page">
  <header class="hub-header">
    <h1>{% if page.heading %}{{ page.heading }}{% else %}{{ page.title }}{% endif %}</h1>
    {% if page.subtitle %}<p class="hub-lead">{{ page.subtitle }}</p>{% endif %}
  </header>
  {{ content }}
</article>

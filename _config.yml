title: Rockenhaus v. Rockenhaus | Michigan Court Filings
title_separator: "|"
description: >-
  Canonical public archive of filed court documents in Rockenhaus v. Rockenhaus:
  Wayne County 26-104594-DO, 26-102221-PP, and Washtenaw 26-737-DO.
url: "https://rockenhaus.net"
baseurl: ""
lang: en_US

# Google Search Console: owner verified via DNS on rockenhaus.net (no HTML tag).
# Bing Webmaster Tools synced with Search Console.

logo: /assets/images/og-default.png
image: /assets/images/og-default.png
twitter:
  card: summary_large_image
  image: /assets/images/og-default.png

author:
  name: Conrad Alan Rockenhaus

plugins:
  - jekyll-seo-tag

# jekyll-sitemap is deliberately NOT enabled. It runs inside the Jekyll build,
# which happens BEFORE the Astro output is merged in, so it structurally cannot
# see /answers/ and never listed it: 367 entries on the live sitemap, none of
# them under the one surface built to be quoted by an answer engine. It also
# stamped every entry with the deploy timestamp, so all 349 lastmod values were
# identical and claimed the whole court record changed at one instant on every
# push. /sitemap.xml is now written by scripts/build-sitemap.mjs AFTER the
# merge, over the tree that is actually being deployed.
#
# The gem stays in the Gemfile. Removing it there would need a Gemfile.lock
# regenerated by bundler, and there is no Ruby on the machine this was written
# on; an unlisted plugin does not run, so leaving it installed changes nothing.

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/images/og-default.png
      image_alt: "Scales of justice — rockenhaus.net canonical Michigan court record"
  - scope:
      path: ""
      type: documents
    values:
      layout: document

collections:
  documents:
    output: true
    permalink: /:collection/:path/

exclude:
  - README.md
  - LICENSE
  - scripts/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - retractions/*.json

markdown: kramdown
kramdown:
  input: GFM

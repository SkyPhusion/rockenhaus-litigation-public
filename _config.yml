title: Rockenhaus v. Rockenhaus | Michigan Court Filings
title_separator: "|"
description: >-
  Canonical public archive of filed court documents in Rockenhaus v. Rockenhaus:
  Wayne County 26-104594-DO, 26-102221-PP, and Washtenaw 26-737-DO.
url: "https://rockenhaus.net"
baseurl: ""
lang: en_US

# Google Search Console: owner verified via DNS on rockenhaus.net (no HTML tag).
# Bing Webmaster Tools synced with Search Console.

logo: /assets/images/og-default.png
image: /assets/images/og-default.png
twitter:
  card: summary_large_image
  image: /assets/images/og-default.png

author:
  name: Conrad Alan Rockenhaus

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/images/og-default.png
      image_alt: "Scales of justice — rockenhaus.net canonical Michigan court record"
  - scope:
      path: ""
      type: documents
    values:
      layout: document

collections:
  documents:
    output: true
    permalink: /:collection/:path/

exclude:
  - README.md
  - LICENSE
  - scripts/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - retractions/*.json

markdown: kramdown
kramdown:
  input: GFM
